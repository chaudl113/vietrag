version: '3.8'

services:
  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: vietrag-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # No API URL variable: the frontend calls relative /api/* and frontend/next.config.js
      # rewrites it to http://localhost:3001 (fixed at build time).
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vietrag-network
    restart: unless-stopped

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: vietrag-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      # Fixed: the port mapping and healthcheck below target 3001 inside the container.
      - PORT=3001
      # Elasticsearch (read by backend/src/services/elasticsearch.ts)
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # JWT
      # No default: a secret written in this public file would let anyone mint tokens.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (e.g. openssl rand -hex 32) in .env or the environment}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      # backend/src/index.ts serves GET /health (not under /api).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - vietrag-network
    restart: unless-stopped

  # ==================== ELASTICSEARCH ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: vietrag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=vietrag-cluster
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - vietrag-network
    restart: unless-stopped

# ==================== NETWORKS ====================
networks:
  vietrag-network:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  es-data:
